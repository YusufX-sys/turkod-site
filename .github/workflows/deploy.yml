# Site asıl olarak Cloudflare Pages'te (https://turkod.pages.dev) yayınlanır;
# Cloudflare depoyu kendisi izler ve her push'ta derler. Bu iş akışı yalnızca
# eski GitHub Pages adresini (yusufx-sys.github.io/turkod-site/) her sayfası
# yeni adrese giden yönlendirme sayfalarıyla doldurur.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/yonlendirme-uret.mjs dist yonlendirme
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./yonlendirme

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
